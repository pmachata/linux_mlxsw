---
name: rt-mdb
protocol: netlink-raw
uapi-header: linux/if_bridge.h
protonum: 0

doc: >-
  Bridge multicast database (MDB) management over rtnetlink.

definitions:
  -
    name: br-port-msg
    type: struct
    header: linux/if_bridge.h
    members:
      -
        name: family
        type: u8
      -
        name: pad
        type: pad
        len: 3
      -
        name: ifindex
        type: u32
  -
    name: mdb-state
    type: enum
    enum-name:
    entries:
      - temporary
      - permanent
  -
    name: mdb-flags
    type: flags
    enum-name:
    entries:
      - offload
      - fast-leave
      - star-excl
      - blocked
      - offload-failed
  -
    name: mcast-filter-mode
    type: enum
    enum-name:
    entries:
      - exclude
      - include
  -
    name: br-mdb-entry
    type: struct
    header: linux/if_bridge.h
    members:
      -
        name: ifindex
        type: u32
      -
        name: state
        type: u8
        enum: mdb-state
      -
        name: flags
        type: u8
        enum: mdb-flags
      -
        name: vid
        type: u16
      -
        name: addr
        type: binary
        len: 16
        doc: >-
          An IPv4 address, an IPv6 address or a MAC address, depending on
          proto. Only the leading bytes are used for the shorter ones.
      -
        name: proto
        type: u16
        byte-order: big-endian
      -
        name: pad
        type: pad
        len: 2

attribute-sets:
  -
    name: mdba-attrs
    name-prefix: mdba-
    doc: Attributes of the MDB dump and notification messages.
    attributes:
      -
        name: mdb
        type: nest
        nested-attributes: mdba-mdb-attrs
        value: 1
      -
        name: router
        type: binary
        doc: >-
          A sequence of MDBA_ROUTER_PORT attributes, each of which carries an
          ifindex of a multicast router port followed by a sequence of
          MDBA_ROUTER_PATTR_* attributes. See MDBA_MDB_ENTRY_INFO for why the
          format is left opaque.
  -
    name: mdba-mdb-attrs
    name-prefix: mdba-mdb-
    attributes:
      -
        name: entry
        type: nest
        nested-attributes: mdba-mdb-entry-attrs
        multi-attr: true
        value: 1
  -
    name: mdba-mdb-entry-attrs
    name-prefix: mdba-mdb-entry-
    attributes:
      -
        name: info
        type: binary
        struct: br-mdb-entry
        value: 1
        doc: >-
          The payload of this attribute is a struct br-mdb-entry, followed by
          a sequence of MDBA_MDB_EATTR_* attributes (timer, source list, group
          mode, source, rtprot, and the VXLAN-specific destination attributes).
          The format is not expressible in a spec, because it is a nest that
          begins with a fixed header, and there is no sibling attribute that
          could serve as a selector of a sub-message. Only the struct is
          decoded; the attributes that follow are ignored.

operations:
  enum-model: directional
  name-prefix: rtm-
  list:
    -
      name: getmdb
      doc: Dump multicast database entries and multicast router ports
      fixed-header: br-port-msg
      attribute-set: mdba-attrs
      dump:
        request:
          value: 86
        reply:
          value: 86
          attributes:
            - mdb
            - router
